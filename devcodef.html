    <!-- GAME ENGINE SCRIPT -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let playerImg = new Image();
        playerImg.src = "simon.png";
        let obstacleImg = new Image();
        obstacleImg.src = "ellie.png";

        const GRAVITY = 0.6;
        const GROUND_Y = canvas.height - 50;
        let score = 0;

        const player = {
            x: 100,
            y: GROUND_Y - 40,
            width: 40,
            height: 40,
            velocityY: 0,
            isJumping: false,
            jumpForce: -12,

            draw() {
                ctx.drawImage(playerImg, this.x, this.y, this.width, this.height);
            },

            update() {
                this.velocityY += GRAVITY;
                this.y += this.velocityY;

                if (this.y + this.height >= GROUND_Y) {
                    this.y = GROUND_Y - this.height;
                    this.velocityY = 0;
                    this.isJumping = false;
                }
            },

            jump() {
                if (!this.isJumping) {
                    this.velocityY = this.jumpForce;
                    this.isJumping = true;
                }
            }
        };
        
const obstacles = [];
let spawnTimer = 0;
let score = 0;
let gameOver = false;

function spawnObstacle() {
    const height = Math.random() * 40 + 20; // 20px to 60px
    obstacles.push({
        x: canvas.width,
        y: GROUND_Y - height,
        width: 25,
        height: height,
        speed: 6
    });
}

// Handle Inputs
window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        if (gameOver) {
            resetGame();
        } else {
            player.jump();
        }
    }
});
        // Keyboard Controls
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                // Prevents Spacebar from scrolling down the web page
                e.preventDefault();
                player.jump();
            }
        });

        function gameLoop() {
            // Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ground Line
            ctx.strokeStyle = "#fff";
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(canvas.width, GROUND_Y);
            ctx.stroke();

            // Update & Draw Player
            player.update();
            player.draw();

            // Render HUD / Score
            ctx.fillStyle = "#fff";
            ctx.font = "20px sans-serif";
            ctx.fillText(`Score: ${score}`, 20, 40);

            requestAnimationFrame(gameLoop);
        }

        // Start Loop
        gameLoop();
